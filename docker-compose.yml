# ============================================================
# Aurum Ghana - Local Development Stack
# ============================================================
# Usage:
#   cp .env.example .env
#   # edit .env with your values
#   docker compose up -d
#
# Services:
#   postgres  - PostgreSQL 16 database
#   backend  - Flask API (port 5000)
#   frontend - Nginx static (port 80)
# ============================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: aurum_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aurum_ghana
      POSTGRES_USER: aurum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurum_dev_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurum -d aurum_ghana"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aurum_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aurum_backend
    restart: unless-stopped
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: 1
      DATABASE_URL: postgresql+psycopg2://aurum:${POSTGRES_PASSWORD:-aurum_dev_pass}@postgres:5432/aurum_ghana
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret-change-in-production}
      JWT_ACCESS_TOKEN_TTL_MIN: 15
      JWT_REFRESH_TOKEN_TTL_DAYS: 7
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_CALLBACK_URL: ${PAYSTACK_CALLBACK_URL:-http://localhost/payment/callback}
      PAYSTACK_WEBHOOK_SECRET: ${PAYSTACK_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@aurum-ghana.local}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:8000}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend:ro
      - ./migrations:/app/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - aurum_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: aurum_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - aurum_network

volumes:
  postgres_data:

networks:
  aurum_network:
    driver: bridge
