{{- /*
Aurum Ghana - Ingress
*/ -}}
{{- if .Values.ingress.enabled -}}
{{- $fullName := include "aurum-ghana.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aurum-ghana.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- /* Frontend: aurumghana.com + www.aurumghana.com */ -}}
    {{- range .Values.ingress.hosts }}
    {{- if eq .backend "frontend" }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: {{ .path | default "/" }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $fullName }}-frontend
                port:
                  number: 80
    {{- end }}
    {{- end }}
    {{- /* Backend: api.aurumghana.com */ -}}
    {{- range .Values.ingress.hosts }}
    {{- if eq .backend "backend" }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: {{ .path | default "/" }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $fullName }}-backend
                port:
                  number: 80
    {{- end }}
    {{- end }}
{{- end }}
