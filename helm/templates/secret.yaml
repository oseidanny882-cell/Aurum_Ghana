{{- /*
Aurum Ghana - Kubernetes Secret for sensitive config
*/ -}}
{{- if .Values.secret.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aurum-ghana.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aurum-ghana.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secret.jwtSecretKey }}
  JWT_SECRET_KEY: {{ .Values.secret.jwtSecretKey | quote }}
  {{- else }}
  JWT_SECRET_KEY: {{ randAlphaNum 64 | quote }}
  {{- end }}
  POSTGRES_PASSWORD: {{ required "secret.postgresPassword is required" .Values.secret.postgresPassword | quote }}
  {{- if .Values.secret.paystackSecretKey }}
  PAYSTACK_SECRET_KEY: {{ .Values.secret.paystackSecretKey | quote }}
  {{- end }}
  {{- if .Values.secret.paystackPublicKey }}
  PAYSTACK_PUBLIC_KEY: {{ .Values.secret.paystackPublicKey | quote }}
  {{- end }}
  {{- if .Values.secret.paystackWebhookSecret }}
  PAYSTACK_WEBHOOK_SECRET: {{ .Values.secret.paystackWebhookSecret | quote }}
  {{- end }}
  {{- if .Values.secret.smtpUser }}
  SMTP_USER: {{ .Values.secret.smtpUser | quote }}
  {{- end }}
  {{- if .Values.secret.smtpPass }}
  SMTP_PASS: {{ .Values.secret.smtpPass | quote }}
  {{- end }}
{{- end }}
