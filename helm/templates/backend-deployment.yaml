{{- /*
Aurum Ghana - Backend Deployment + Service
*/ -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aurum-ghana.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "aurum-ghana.name" . }}-backend
    {{- include "aurum-ghana.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aurum-ghana.name" . }}-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "aurum-ghana.name" . }}-backend
        {{- include "aurum-ghana.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "aurum-ghana.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Values.backend.name | default "api" }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.containerPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.backend.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.livenessProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.backend.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.readinessProbe.periodSeconds }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          env:
            - name: FLASK_ENV
              value: {{ .Values.backend.env.FLASK_ENV | quote }}
            - name: FLASK_DEBUG
              value: {{ .Values.backend.env.FLASK_DEBUG | quote }}
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "aurum-ghana.fullname" . }}-config
                  key: DATABASE_URL
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "aurum-ghana.fullname" . }}-secret
                  key: JWT_SECRET_KEY
            - name: PAYSTACK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "aurum-ghana.fullname" . }}-secret
                  key: PAYSTACK_SECRET_KEY
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "aurum-ghana.fullname" . }}-secret
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "aurum-ghana.fullname" . }}-secret
                  key: SMTP_PASS
                  optional: true
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "aurum-ghana.fullname" . }}-config
                  key: FRONTEND_URL
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "aurum-ghana.fullname" . }}-config
                  key: CORS_ORIGINS
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aurum-ghana.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aurum-ghana.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "aurum-ghana.name" . }}-backend
