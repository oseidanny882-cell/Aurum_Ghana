{{- /*
Aurum Ghana - Service Account
*/ -}}
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aurum-ghana.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aurum-ghana.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
