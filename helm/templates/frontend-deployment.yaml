{{- /*
Aurum Ghana - Frontend Deployment + Service
*/ -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aurum-ghana.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "aurum-ghana.name" . }}-frontend
    {{- include "aurum-ghana.labels" . | nindent 4 }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aurum-ghana.name" . }}-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "aurum-ghana.name" . }}-frontend
        {{- include "aurum-ghana.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Values.frontend.name | default "web" }}
          image: "{{ .Values.imageFrontend.repository }}:{{ .Values.imageFrontend.tag }}"
          imagePullPolicy: {{ .Values.imageFrontend.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.containerPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aurum-ghana.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aurum-ghana.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "aurum-ghana.name" . }}-frontend
