{{- /*
Aurum Ghana - PostgreSQL StatefulSet
*/ -}}
{{- if .Values.postgresql.enabled -}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aurum-ghana.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aurum-ghana.labels" . | nindent 4 }}
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app.kubernetes.io/name: {{ include "aurum-ghana.name" . }}-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "aurum-ghana.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "aurum-ghana.name" . }}-postgres
    {{- include "aurum-ghana.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "aurum-ghana.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aurum-ghana.name" . }}-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "aurum-ghana.name" . }}-postgres
        {{- include "aurum-ghana.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image }}
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "aurum-ghana.fullname" . }}-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgresql.auth.username }}", "-d", "{{ .Values.postgresql.auth.database }}"]
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgresql.auth.username }}", "-d", "{{ .Values.postgresql.auth.database }}"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          {{- if .Values.postgresql.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "aurum-ghana.fullname" . }}-postgres-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
  {{- if .Values.postgresql.persistence.enabled }}
volumeClaimTemplates:
  - metadata:
      name: {{ include "aurum-ghana.fullname" . }}-postgres-pvc
      namespace: {{ .Release.Namespace }}
    spec:
      accessModes: ["ReadWriteOnce"]
      {{- if .Values.postgresql.persistence.storageClass }}
      storageClassName: {{ .Values.postgresql.persistence.storageClass | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.postgresql.persistence.size | quote }}
  {{- end }}
{{- end }}
